[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waste-sorting-assistant"
version = "0.1.0"
description = "Waste classification and distributed inference experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["Pillow==13.0.0", "pydantic==2.12.5", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
